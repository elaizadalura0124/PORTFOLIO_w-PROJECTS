<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scale Text</title>
  <style>
    p {
      font-weight: 400;
      transition: transform 0.3s ease;
    }

    p:hover {
      transform: scale(1.05); 
    }
  </style>
</head>
<body>

  <p>Hover over this text</p>

</body>
</html>
